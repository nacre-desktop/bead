# Check bead-* roots independently: GPL may never leak into their dependencies.
[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "Zlib", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "0BSD", "Unlicense", "MIT-0"]
# Native PipeWire build helper; LLVM exception grants additional Apache permissions.
exceptions = [{ crate = "target-lexicon@0.13.5", allow = ["Apache-2.0 WITH LLVM-exception"] }]
[bans]
multiple-versions = "warn"
[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# These three informational unmaintained notices concern standalone crates merged into zbus 6; the advisories report no vulnerability. Current AccessKit, AT-SPI and tray support still requires zbus 5. Upstream: https://github.com/z-galaxy/zbus/issues/2043. Revisit when AccessKit/AT-SPI/tray support zbus 6 or by 2027-01-31. This exception is limited to the three IDs below.
ignore = [
{ id = "RUSTSEC-2026-0370", reason = "Informational unmaintained notice for zvariant, merged into zbus 6; no vulnerability reported. zbus 5 is still required by AccessKit, AT-SPI and tray; revisit per the comment above." },
{ id = "RUSTSEC-2026-0371", reason = "Informational unmaintained notice for zbus_names, merged into zbus 6; no vulnerability reported. zbus 5 is still required by AccessKit, AT-SPI and tray; revisit per the comment above." },
{ id = "RUSTSEC-2026-0372", reason = "Informational unmaintained notice for zvariant_derive, merged into zbus 6; no vulnerability reported. zbus 5 is still required by AccessKit, AT-SPI and tray; revisit per the comment above." },
{ id = "RUSTSEC-2026-0192", reason = "Informational unmaintained ttf-parser via fontdb/cosmic-text and usvg; no patched release. Feature 2 uses installed fonts only. Track replacement before loading untrusted font files; other advisories remain errors." }]
