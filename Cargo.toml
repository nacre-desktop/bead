[workspace]
resolver = "3"
exclude = ["spikes/blank-layer"]
members = ["crates/bead-test", "crates/bead", "crates/bead-services", "crates/bead-backends", "crates/bead-core", "crates/bead-ui", "crates/bead-wayland", "crates/bead-render", "crates/bead-wallpaper", "crates/nacre-shell"]
default-members = ["crates/bead", "crates/bead-services", "crates/nacre-shell"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"

# Release-shaped binary with symbols for live perf call stacks. Add
# `RUSTFLAGS="-C force-frame-pointers=yes"` when building this profile.
[profile.profiling]
inherits = "release"
debug = 2
strip = false

# B0085: dependencies are size-optimised (about 2 MiB less resident code, no measured latency change);
# the render/text hot path and every workspace crate stay at 3. Release builds only.
[profile.release.package."*"]
opt-level = "s"

[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.tiny-skia-path]
opt-level = 3

[profile.release.package.skrifa]
opt-level = 3

[profile.release.package.read-fonts]
opt-level = 3

[profile.release.package.harfrust]
opt-level = 3

[profile.release.package.zeno]
opt-level = 3

[profile.release.package.taffy]
opt-level = 3

[profile.release.package.usvg]
opt-level = 3

[profile.release.package.cosmic-text]
opt-level = 3

# Wallpaper decoding is an interactive hot path, like raster/text work.
[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.zune-core]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.fast_image_resize]
opt-level = 3

# Upstream 0.8.9 leaves DBusMenu signal tasks alive after an item exits.
[patch.crates-io]
system-tray = { path = "vendor/system-tray" }
fontconfig = { path = "vendor/fontconfig" }
