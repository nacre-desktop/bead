[workspace]
resolver = "3"
exclude = ["spikes/blank-layer"]
members = ["crates/bead", "crates/bead-services", "crates/bead-backends", "crates/bead-core", "crates/bead-ui", "crates/bead-wayland", "crates/bead-render", "crates/nacre-shell"]
default-members = ["crates/bead", "crates/bead-services", "crates/nacre-shell"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[profile.release]
opt-level = 3
codegen-units = 1

# Upstream 0.8.9 leaves DBusMenu signal tasks alive after an item exits.
[patch.crates-io]
system-tray = { path = "vendor/system-tray" }
fontconfig = { path = "vendor/fontconfig" }
