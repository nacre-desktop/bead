[package]
name = "bead-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bead-core = { path = "../bead-core" }
bead-render = { path = "../bead-render", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
mlua = { version = "=0.12.2", features = ["luau", "vendored", "serde"] }
notify = { version = "=8.2.0", default-features = false }
taffy = { version = "=0.15.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }

unicode-segmentation = "1.13"

accesskit = "=0.25.1"

[features]
test-counters = []
