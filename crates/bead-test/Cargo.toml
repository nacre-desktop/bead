[package]
name = "bead-test"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
bead-core = { path = "../bead-core" }
bead-ui = { path = "../bead-ui", features = ["test-counters"] }
bead-render = { path = "../bead-render", default-features = false }
accesskit = "=0.25.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
