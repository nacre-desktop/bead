[package]
name = "bead-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
tiny-skia = "=0.12.0"
cosmic-text = "0.19"
resvg = { version = "0.47", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
fontdb = "=0.23.0"
raw-window-handle = { version = "=0.6.2", optional = true }
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan", "wgsl"], optional = true }
vello = { version = "=0.11.0", default-features = false, features = ["wgpu"], optional = true }
femtovg = { version = "=0.27.0", default-features = false, features = ["wgpu"], optional = true }
pollster = { version = "=0.4.0", optional = true }
rgb = { version = "0.8", optional = true }
imgref = { version = "1", optional = true }
glutin = { version = "0.32", default-features = false, features = ["egl", "wayland"], optional = true }

[features]
gpu = ["dep:wgpu", "dep:vello", "dep:femtovg", "dep:pollster", "dep:raw-window-handle", "dep:rgb", "dep:imgref", "dep:glutin"]
