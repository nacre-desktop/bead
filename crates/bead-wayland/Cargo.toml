[package]
name = "bead-wayland"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["calloop", "system", "xkbcommon"] }
wayland-client = {version="=0.31.15", features=["system"]}
calloop = { version = "=0.14.5", features = ["signals"] }
bead-render = { path = "../bead-render" }
bead-core = { path = "../bead-core" }
bead-backends = { path = "../bead-backends" }
bead-services = { path = "../bead-services" }
wayland-protocols = { version = "=0.32.13", features = ["client", "staging", "unstable"] }

raw-window-handle = {version="=0.6.2",optional=true}

[dependencies.accesskit]
version="=0.25.1"

[dependencies.accesskit_unix]
version="=0.24.0"

[features]
gpu=["bead-render/gpu","dep:raw-window-handle"]
