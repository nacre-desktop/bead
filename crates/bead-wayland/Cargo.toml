[package]
name = "bead-wayland"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
libc = "0.2"
serde_json="1"
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["calloop", "system", "xkbcommon"] }
wayland-client = {version="=0.31.15", features=["system"]}
calloop = { version = "=0.14.5", features = ["signals"] }
bead-render = { path = "../bead-render", default-features = false }
bead-core = { path = "../bead-core" }
bead-backends = { path = "../bead-backends" }
bead-services = { path = "../bead-services" }
image = { version = "0.25", default-features = false, features = ["png"] }
wayland-protocols = { version = "=0.32.13", features = ["client", "staging", "unstable"] }

raw-window-handle = {version="=0.6.2",optional=true}

[dependencies.accesskit]
version="=0.25.1"

[dependencies.accesskit_unix]
version="=0.24.0"

[features]
default = ["native-gl"]
native-gl = ["bead-render/native-gl", "dep:raw-window-handle"]
wgpu = ["bead-render/wgpu", "dep:raw-window-handle"]
vello = ["wgpu"]
gpu = ["native-gl", "wgpu"]
