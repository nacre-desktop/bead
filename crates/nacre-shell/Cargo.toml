[package]
name = "nacre-shell"
default-run = "nacre-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
publish = false

[dependencies]
bead-test = { path = "../bead-test" }
bead={path="../bead",default-features=false}
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gdk-pixbuf = "0.22"
libc = "0.2"
niri-ipc = "=26.4.0"
nix = {version="0.31",features=["signal","user","inotify"]}
serde_json = "1"
serde = {version="1",features=["derive"]}
accesskit = "=0.25.1"
bead-wallpaper = { path = "../bead-wallpaper" }
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["calloop", "system"] }
wayland-client = { version = "=0.31.15", features = ["system"] }
wayland-protocols = { version = "=0.32.13", features = ["client"] }
calloop = "=0.14.5"

freedesktop-icons = "0.4"

fontconfig = "=0.11.0"
fontdb = "=0.23.0"
skrifa = "=0.44.0"

nacre-protocol = { git = "https://github.com/nacre-desktop/nacre", rev = "4db189afaa7e00e26d1a419fa17426651f46c4c9" }
tokio = { version = "1", features = ["rt", "sync", "net", "io-util", "time", "macros"] }

[features]
default=["native-gl"]
native-gl=["bead/native-gl"]
wgpu=["bead/wgpu"]
vello=["wgpu"]
gpu=["native-gl","wgpu"]
trace=[]
