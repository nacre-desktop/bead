[package]
name = "nacre-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
publish = false

[dependencies]
bead-test = { path = "../bead-test" }
bead={path="../bead",default-features=false}
image = { version = "0.25", default-features = false, features = ["png"] }
niri-ipc = "=26.4.0"
nix = {version="0.31",features=["signal","user","inotify"]}
serde_json = "1"
serde = {version="1",features=["derive"]}
accesskit = "=0.25.1"

freedesktop-icons = "0.4"

fontconfig = "=0.11.0"
fontdb = "=0.23.0"
skrifa = "=0.44.0"

nacre-protocol = { git = "https://github.com/nacre-desktop/nacre", rev = "1e2d6755df9a1d5e45c26b7a7e301d9761c65e9a" }
tokio = { version = "1", features = ["rt", "sync", "net", "io-util", "time", "macros"] }

[features]
default=["native-gl"]
native-gl=["bead/native-gl"]
wgpu=["bead/wgpu"]
vello=["wgpu"]
gpu=["native-gl","wgpu"]
trace=[]
