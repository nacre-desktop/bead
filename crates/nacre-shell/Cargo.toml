[package]
name = "nacre-shell"
default-run = "nacre-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
publish = false

[dependencies]
bead-test = { path = "../bead-test" }
bead={path="../bead",default-features=false}
image = { version = "0.25", default-features = false, features = ["png"] }
gdk-pixbuf = "0.22"
libc = "0.2"
niri-ipc = "=26.4.0"
nix = {version="0.31",features=["signal","user","inotify"]}
serde_json = "1"
serde = {version="1",features=["derive"]}
accesskit = "=0.25.1"

freedesktop-icons = "0.4"

fontconfig = "=0.11.0"
fontdb = "=0.23.0"
skrifa = "=0.44.0"

nacre-protocol = { git = "https://github.com/nacre-desktop/nacre", rev = "652d6c4fcb775003e734681bb664d78582f67f1b" }
tokio = { version = "1", features = ["rt", "sync", "net", "io-util", "time", "macros"] }

[features]
default=["native-gl"]
native-gl=["bead/native-gl"]
wgpu=["bead/wgpu"]
vello=["wgpu"]
gpu=["native-gl","wgpu"]
trace=[]
