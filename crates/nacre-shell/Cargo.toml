[package]
name = "nacre-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
bead-wayland = { path = "../bead-wayland", default-features = false }
bead-render = { path = "../bead-render", default-features = false }
bead-ui = { path = "../bead-ui" }
bead-core = { path = "../bead-core" }
bead-backends = { path = "../bead-backends" }
bead-services = { path = "../bead-services" }
niri-ipc = "=26.4.0"
nix = {version="0.31",features=["signal"]}
serde_json = "1"
serde = {version="1",features=["derive"]}
accesskit = "=0.25.1"

freedesktop-icons = "0.4"

fontconfig = "=0.11.0"
fontdb = "=0.23.0"
skrifa = "=0.44.0"

[features]
default=["native-gl"]
native-gl=["bead-wayland/native-gl","bead-render/native-gl"]
wgpu=["bead-wayland/wgpu","bead-render/wgpu"]
vello=["wgpu"]
gpu=["native-gl","wgpu"]
trace=[]

[dependencies.freedesktop-desktop-entry]
version = "=0.8.3"
default-features = false
