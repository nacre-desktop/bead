[package]
name = "nacre-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
publish = false

[dependencies]
bead-wayland = { path = "../bead-wayland" }
bead-render = { path = "../bead-render" }
bead-ui = { path = "../bead-ui" }
bead-core = { path = "../bead-core" }
serde_json = "1"
accesskit = "=0.25.1"

freedesktop-icons = "0.4"

fontconfig = "=0.11.0"
fontdb = "=0.23.0"
skrifa = "=0.44.0"

[features]
default=["gpu"]
gpu=["bead-wayland/gpu","bead-render/gpu"]

[dependencies.freedesktop-desktop-entry]
version = "=0.8.3"
default-features = false
