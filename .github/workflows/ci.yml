name: Rust checks
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: bead-ci-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.NACRE_CI_RUNNER || '["self-hosted","linux","nacre-ci"]') }}
    env:
      HOME: /github/home
      CARGO_HOME: /github/home/.cargo
      RUSTUP_HOME: /github/home/.rustup
    container:
      image: ubuntu:24.04
      options: ${{ !contains(vars.NACRE_CI_RUNNER, 'ubuntu-') && '--cpus=10 --memory=28g' || '' }}
    defaults:
      run:
        shell: nice -n 10 bash -e -o pipefail {0}
    steps:
      - name: Prepare Ubuntu container
        run: |
          mkdir -p "$HOME" "$CARGO_HOME/bin"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          apt-get update -qq
          apt-get install -y ca-certificates build-essential curl git python3 unzip systemd libwayland-dev libfontconfig1-dev libxkbcommon-dev libpipewire-0.3-dev libclang-dev libgdk-pixbuf-2.0-dev webp-pixbuf-loader pkg-config dbus libmpv2 ffmpeg sway grim python3-pil
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-13
      - name: Trust the checked-out workspace for Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
      - name: Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          cache: false
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -j2 -- -D warnings
      - name: Headless services dependency boundary
        run: python3 tools/check-service-boundary.py
      - name: Tests
        run: |
          cargo test --workspace --locked -j2
          cargo test -p nacre-shell --features trace --locked -j2 memory_policy::tests::
        env:
          BEAD_TEST_ARTIFACTS: ${{ runner.temp }}/bead-headless
      - name: Headless golden artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bead-headless-diffs
          path: ${{ runner.temp }}/bead-headless
          if-no-files-found: ignore
      - name: Renderer feature configurations
        run: |
          cargo check -p nacre-shell --no-default-features --locked -j2
          cargo check --workspace --all-features --locked -j2
      - name: Facade, headless UI and Luau schema
        run: |
          cargo run -p bead --example minimal --locked -j2 -- --check
          cargo build -p nacre-shell --no-default-features --locked -j2
          target/debug/nacre-shell --check shell/ui/main.luau
          mkdir -p "$RUNNER_TEMP/luau"
          curl -fsSL https://github.com/luau-lang/luau/releases/download/0.742/luau-ubuntu.zip -o "$RUNNER_TEMP/luau.zip"
          echo "152058b98c60ff1f5b5ec9bca0b8eb37793cae161dd3a05608cc3d8738ba1a4d  $RUNNER_TEMP/luau.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/luau.zip" -d "$RUNNER_TEMP/luau"
          chmod +x "$RUNNER_TEMP/luau/luau-analyze"
          python3 tools/check-luau.py --analyzer "$RUNNER_TEMP/luau/luau-analyze" --binary "$PWD/target/debug/nacre-shell" --check-generated
      - name: Dashboard capture-window regression tests
        run: |
          nice -n 10 python3 -m unittest discover -s spikes/tests -p test_dashboard_capture_windows.py
          nice -n 10 python3 -m unittest discover -s spikes/tests -p test_menu_engine_trace.py
          nice -n 10 python3 -m unittest discover -s spikes/tests -p test_b0003_arm.py
          nice -n 10 python3 -m unittest discover -s spikes/tests -p test_b0002_arm.py
          nice -n 10 python3 -m unittest discover -s spikes/tests -p test_laptop_reference_capture.py
          nice -n 10 python3 -m unittest discover -s spikes/tests -p test_foundation_preview.py
          nice -n 10 python3 -m unittest discover -s spikes/tests -p test_fake_system.py
          nice -n 10 python3 -m unittest discover -s spikes/tests -p test_fullscreen_lips.py
          nice -n 10 python3 -m unittest discover -s spikes/tests -p test_pearl_release_proof.py
          nice -n 10 python3 -m unittest discover -s spikes/tests -p test_detach_ghost_proof.py
          nice -n 10 python3 -m unittest discover -s spikes/tests -p test_launcher_icons_proof.py
          nice -n 10 python3 -m unittest discover -s spikes/tests -p test_launcher_memory_proof.py
          nice -n 10 python3 -m unittest discover -s spikes/tests -p test_scrolling_proof.py
          nice -n 10 python3 -m py_compile spikes/capture_safety.py spikes/measure.py spikes/bar-matrix.py spikes/dashboard-residency.py spikes/launcher-proof.py spikes/b0002-arm.py spikes/laptop-reference-capture.py spikes/laptop-reference-artifacts.py spikes/parity-compare.py spikes/fake-bluez.py spikes/fake-power.py spikes/fake_system.py spikes/foundation-preview.py spikes/menu-engine-proof.py spikes/menu_engine_trace.py spikes/b0003-arm.py spikes/tests/test_dashboard_capture_windows.py spikes/tests/test_menu_engine_trace.py spikes/tests/test_b0002_arm.py spikes/tests/test_laptop_reference_capture.py spikes/tests/test_b0003_arm.py spikes/tests/test_fake_system.py spikes/tests/test_launcher_memory_proof.py
      - name: Packaging staging and launcher
        run: python3 -m unittest discover -s packaging/tests
      - name: Motion wallpaper renderer smoke
        run: |
          cargo build -p nacre-shell --bin bead-wallpaper-video --locked -j2
          python3 spikes/wallpaper-video-smoke.py --engine target/debug/bead-wallpaper-video --expect-presentation shm
      - name: Private service owner lifecycle
        run: python3 spikes/services-check.py
      - name: Private SNI and DBusMenu lifecycle
        run: |
          dbus-run-session -- bash -c 'export DBUS_SYSTEM_BUS_ADDRESS="$DBUS_SESSION_BUS_ADDRESS" BEAD_PRIVATE_SERVICES_TEST=1 BEAD_FIXTURE_UPDATE=1; cargo test -p bead-services --test tray_private_bus --locked -j2 -- --ignored --nocapture'
      - name: Clock tick across a busy minute boundary
        run: |
          dbus-run-session -- bash -c 'export DBUS_SYSTEM_BUS_ADDRESS="$DBUS_SESSION_BUS_ADDRESS" BEAD_PRIVATE_SERVICES_TEST=1; cargo test -p bead-services --test clock_private_bus --locked -j2 -- --ignored --nocapture'
      - name: Install cargo-deny
        run: |
          asset=cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          base=https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2
          curl -fsSL "$base/$asset" -o "$RUNNER_TEMP/$asset"
          curl -fsSL "$base/$asset.sha256" -o "$RUNNER_TEMP/deny.sha256"
          cd "$RUNNER_TEMP"
          printf '%s  %s\n' "$(cat deny.sha256)" "$asset" | sha256sum -c -
          tar -xzf "$asset"
          install -m 755 "$RUNNER_TEMP/${asset%.tar.gz}/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
      - name: Dependency and license checks
        run: |
          cargo deny check
          for manifest in crates/bead-*/Cargo.toml crates/bead/Cargo.toml; do
            cargo deny --manifest-path "$manifest" --all-features --config deny-framework.toml check
          done
