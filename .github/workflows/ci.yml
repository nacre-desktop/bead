name: Rust checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-13
      - name: Native client build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y libwayland-dev pkg-config
      - name: Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
