name: Rust checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-13
      - name: Native client build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y libwayland-dev libfontconfig1-dev pkg-config
      - name: Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Install cargo-deny
        shell: bash
        run: |
          asset=cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          base=https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2
          curl -fsSL "$base/$asset" -o "$RUNNER_TEMP/$asset"
          curl -fsSL "$base/$asset.sha256" -o "$RUNNER_TEMP/deny.sha256"
          cd "$RUNNER_TEMP"
          printf '%s  %s\n' "$(cat deny.sha256)" "$asset" | sha256sum -c -
          tar -xzf "$asset"
          install -m 755 "$RUNNER_TEMP/${asset%.tar.gz}/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
      - name: Dependency and license checks
        run: |
          cargo deny check
          for manifest in crates/bead-*/Cargo.toml; do
            cargo deny --manifest-path "$manifest" --all-features --config deny-framework.toml check
          done
